<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>机顶盒 · 局域网观看</title>
<style>
  :root { --bg:#0f1218; --panel:#1a2029; --key:#2a3342; --key2:#39465c; --acc:#4da3ff; --txt:#dfe6ef; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif; }
  #wrap { max-width:1100px; margin:0 auto; padding:10px; }
  header { display:flex; align-items:center; gap:10px; padding:4px 2px 10px; }
  header h1 { font-size:17px; margin:0; flex:1; }
  #st { font-size:12px; color:#8ea0b8; }
  #aud { padding:8px 12px; font-size:13px; border-radius:8px; background:var(--key); }
  .dot { width:9px; height:9px; border-radius:50%; background:#666; display:inline-block; margin-right:5px; }
  .dot.on { background:#38d07b; } .dot.err { background:#f05b5b; }
  #vbox { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:16/9; }
  #cv { width:100%; height:100%; display:block; background:#000; object-fit:contain; }
  #vmsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#9fb0c5; font-size:14px; background:#000a; }
  #grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  @media(max-width:820px){ #grid { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border-radius:10px; padding:12px; }
  .panel h2 { font-size:13px; margin:0 0 10px; color:#93a6bf; font-weight:600; }
  .pad { display:grid; grid-template-columns:repeat(3,54px); grid-auto-rows:54px; gap:8px; justify-content:center; }
  button { background:var(--key); color:var(--txt); border:0; border-radius:10px; font-size:16px; cursor:pointer; }
  button:active { background:var(--acc); color:#04121f; }
  .side { display:flex; gap:8px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
  .side button { padding:10px 14px; font-size:14px; }
  .bar { display:flex; gap:8px; margin-top:10px; }
  .bar input { flex:1; background:var(--key); border:0; border-radius:8px; padding:10px; color:var(--txt); font-size:14px; }
  .bar button { padding:10px 14px; }
  #apps { display:flex; flex-direction:column; gap:6px; max-height:320px; overflow:auto; }
  .app { display:flex; align-items:center; gap:8px; background:var(--key); border-radius:8px; padding:9px 10px; font-size:13px; cursor:pointer; }
  .app:active { background:var(--key2); }
  .app small { color:#7f93ad; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .hint { font-size:11px; color:#66788e; margin-top:8px; line-height:1.5; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>📺 机顶盒局域网观看</h1>
    <span id="st"><span class="dot"></span>连接中…</span>
    <button id="aud">🔇 开启声音</button>
  </header>
  <div id="vbox">
    <canvas id="cv"></canvas>
    <div id="vmsg">正在启动画面…</div>
  </div>

  <div id="grid">
    <div class="panel">
      <h2>遥控器（点画面也可直接触控盒子）</h2>
      <div class="pad">
        <span></span><button data-k="up">▲</button><span></span>
        <button data-k="left">◀</button><button data-k="ok">OK</button><button data-k="right">▶</button>
        <span></span><button data-k="down">▼</button><span></span>
      </div>
      <div class="side">
        <button data-k="back">返回</button>
        <button data-k="home">主页</button>
        <button data-k="menu">菜单</button>
        <button data-k="volup">音量+</button>
        <button data-k="voldn">音量−</button>
        <button data-k="info">信息</button>
      </div>
      <div class="bar">
        <input id="txt" placeholder="输入文字（英文/数字）发送到盒子">
        <button id="send">发送</button>
      </div>
      <div class="hint">按键走 adb 指令（约 0.1 秒）。部分正版 IPTV 应用有画面保护，串流里可能显示黑屏，属正常。</div>
    </div>

    <div class="panel">
      <h2>盒子里的应用 · 点一下就在盒子上打开</h2>
      <div id="apps">加载中…</div>
    </div>
  </div>
</div>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const vmsg = document.getElementById('vmsg'), st = document.getElementById('st');
let stopped = false, decoder = null, sps = null, pps = null;
let awaitKey = true, qDepth = 0, fpsCnt = 0, shown = false, curCodec = '';

function setSt(cls, txt){ st.innerHTML = '<span class="dot ' + cls + '"></span>' + txt; }

async function waitCodec(){
  for(let i=0;i<120;i++){
    try{ const j = await (await fetch('/info')).json(); if(j.ready) return j; }catch(e){}
    await new Promise(r=>setTimeout(r,500));
  }
  throw new Error('盒子流未就绪');
}

// ---- annexb helpers ----
function splitNals(u8){
  const marks = []; // [bodyStart, startCodeLen]
  for(let i=0;i+2<u8.length;i++){
    if(u8[i]===0 && u8[i+1]===0){
      if(u8[i+2]===1){ marks.push([i+3,3]); i+=2; }
      else if(u8[i+2]===0 && i+3<u8.length && u8[i+3]===1){ marks.push([i+4,4]); i+=3; }
    }
  }
  const out = [];
  for(let k=0;k<marks.length;k++){
    const s = marks[k][0];
    let e = k+1<marks.length ? marks[k+1][0]-marks[k+1][1] : u8.length;
    while(e>s && u8[e-1]===0) e--;
    if(e>s) out.push(u8.subarray(s,e));
  }
  return out;
}
function toAvcc(nals){
  const keep = nals.filter(n=>n.length>1 && (n[0]&31)>=1 && (n[0]&31)<=5);
  if(!keep.length) return null;
  let len = 0; for(const n of keep) len += 4+n.length;
  const out = new Uint8Array(len); let o = 0;
  for(const n of keep){
    out[o++]=n.length>>>24; out[o++]=n.length>>>16; out[o++]=n.length>>>8; out[o++]=n.length;
    out.set(n,o); o+=n.length;
  }
  return out;
}
function buildAvcC(s, p){
  const a = new Uint8Array(6 + 2+s.length + 1 + 2+p.length);
  let o = 0;
  a[o++]=1; a[o++]=s[1]; a[o++]=s[2]; a[o++]=s[3]; a[o++]=0xFF; a[o++]=0xE1;
  a[o++]=s.length>>8; a[o++]=s.length&255; a.set(s,o); o+=s.length;
  a[o++]=1; a[o++]=p.length>>8; a[o++]=p.length&255; a.set(p,o);
  return a.buffer;
}

function onFrame(f){
  qDepth = Math.max(0, qDepth-1);
  if(cv.width!==f.displayWidth || cv.height!==f.displayHeight){ cv.width=f.displayWidth; cv.height=f.displayHeight; }
  ctx.drawImage(f, 0, 0, f.displayWidth, f.displayHeight);
  f.close();
  fpsCnt++;
  if(!shown){ shown = true; vmsg.style.display='none'; }
}
function configure(){
  if(!sps || !pps) return;
  if(decoder){ try{ decoder.close(); }catch(e){} }
  decoder = new VideoDecoder({
    output: onFrame,
    error: e => { console.warn('decoder error: '+e.message); try{ decoder.reset(); }catch(e2){} awaitKey = true; }
  });
  decoder.configure({ codec: curCodec, description: buildAvcC(sps, pps), optimizeForLatency: true });
  awaitKey = true; qDepth = 0;
}

async function startPlay(){
  if(!('VideoDecoder' in window)){
    vmsg.innerHTML = '浏览器安全限制：局域网 HTTP 无法解码。<br>请改用 HTTPS 地址：<a style="color:#4da3ff" href="https://' + location.hostname + ':8443">https://' + location.hostname + ':8443</a><br><span style="font-size:12px">（证书为自己签发，警告页点“高级 → 继续前往”即可）</span>';
    return;
  }
  vmsg.style.display='flex'; if(!shown) setSt('','连接画面…');
  const info = await waitCodec();
  curCodec = info.codec;
  sps = pps = null; shown = false;
  if(decoder){ try{ decoder.reset(); }catch(e){} } // new stream: discard old-session timestamps
  const r = await fetch('/h264');
  const rd = r.body.getReader();
  let buf = new Uint8Array(0);
  try{
    for(;;){
      const {done, value} = await rd.read();
      if(done) break;
      const nb = new Uint8Array(buf.length+value.length); nb.set(buf); nb.set(value, buf.length); buf = nb;
      while(buf.length>=12){
        const dv = new DataView(buf.buffer);
        const q = dv.getBigUint64(0), size = dv.getUint32(8);
        if(buf.length < 12+size) break;
        const pay = buf.subarray(12, 12+size);
        buf = buf.slice(12+size);
        const isCfg = (q>>62n)&1n, isKey = (q>>61n)&1n, pts = Number(q & 0x1fffffffffffffffn);
        if(isCfg){
          for(const n of splitNals(pay)){ const t = n[0]&31; if(t===7) sps = n; else if(t===8) pps = n; }
          configure();
        } else if(decoder && decoder.state==='configured'){
          if(isKey) awaitKey = false;
          if(awaitKey) continue;
          if(qDepth > 15){ awaitKey = true; continue; }
          const avc = toAvcc(splitNals(pay));
          if(!avc) continue;
          qDepth++;
          try{ decoder.decode(new EncodedVideoChunk({ type: isKey?'key':'delta', timestamp: pts, duration: 33333, data: avc })); }
          catch(e){ console.warn('decode fail: '+e.message); try{ decoder.reset(); }catch(e2){} awaitKey = true; qDepth = 0; }
        }
      }
    }
  }catch(e){ /* stream ended */ }
  if(!stopped){ setSt('err','画面中断，重连…'); try{ if(decoder) decoder.close(); }catch(e){} decoder = null; setTimeout(startPlay, 1500); }
}
startPlay();

setInterval(()=>{
  if(shown) setSt('on', '直播中 · ' + fpsCnt + ' fps · ' + curCodec);
  fpsCnt = 0;
}, 2000);

// ---- audio: system loopback PCM s16le 48k stereo from /audio ----
let actx = null, gainNode = null, audioRun = false, audioAbort = null;
const audBtn = document.getElementById('aud');
async function startAudio(){
  if(audioRun) return;
  audioRun = true;
  audBtn.textContent = '声音启动中…';
  try{
    if(!actx){
      try{ actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 }); }
      catch(e2){ actx = new (window.AudioContext || window.webkitAudioContext)(); }
    }
    await actx.resume();
    if(actx.state !== 'running') audBtn.textContent = '🔇 点一下页面以出声';
    if(!gainNode){ gainNode = actx.createGain(); gainNode.connect(actx.destination); }
    audioAbort = new AbortController();
    const r = await fetch('/audio', { signal: audioAbort.signal });
    audBtn.textContent = '🔊 关闭声音';
    const rd = r.body.getReader();
    let nextT = 0, carry = new Uint8Array(0);
    for(;;){
      const {done, value} = await rd.read();
      if(done || !audioRun) break;
      let bytes;
      if(carry.length){ bytes = new Uint8Array(carry.length + value.length); bytes.set(carry); bytes.set(value, carry.length); }
      else bytes = value;
      const n = bytes.length & ~1;
      carry = (bytes.length & 1) ? bytes.subarray(n) : new Uint8Array(0);
      if(n < 4) continue;
      const dv = new DataView(bytes.buffer, bytes.byteOffset, n);
      const frames = n >> 2;
      const ab = actx.createBuffer(2, frames, 48000);
      const L = ab.getChannelData(0), R = ab.getChannelData(1);
      for(let k=0;k<frames;k++){ L[k] = dv.getInt16(k*4, true)/32768; R[k] = dv.getInt16(k*4+2, true)/32768; }
      const now = actx.currentTime;
      if(nextT < now + 0.02) nextT = now + 0.15;   // underrun: re-anchor lead
      if(nextT - now > 0.9) continue;              // too far ahead: drop chunk to catch up
      const src = actx.createBufferSource();
      src.buffer = ab; src.connect(gainNode); src.start(nextT);
      nextT += ab.duration;
      window.__aud = window.__aud || {bytes:0, chunks:0, lag:0};
      window.__aud.bytes += n; window.__aud.chunks++; window.__aud.lag = +(nextT - now).toFixed(2);
    }
  }catch(e){ /* aborted or stream ended */ }
  if(audioRun){ audioRun = false; audBtn.textContent = '🔇 开启声音'; }
}
function stopAudio(){
  audioRun = false; audioAutoArmed = false;
  try{ if(audioAbort) audioAbort.abort(); }catch(e){}
  audBtn.textContent = '🔇 开启声音';
}
audBtn.onclick = () => { audioRun ? stopAudio() : startAudio(); };
let audioAutoArmed = true;
window.addEventListener('pointerdown', e => {
  if(audioAutoArmed && e.target !== audBtn){ audioAutoArmed = false; if(!audioRun) startAudio(); return; }
  if(actx && actx.state !== 'running'){ try{ actx.resume(); }catch(e){} }   // Android 仍拦截:每次触摸再试一次
}, {capture:true});
document.addEventListener('visibilitychange', () => { if(!document.hidden && actx && audioRun){ try{ actx.resume(); }catch(e){} } });

// tap -> box coordinates (device space 1920x1080), account for object-fit letterbox
cv.addEventListener('click', e=>{
  const r = cv.getBoundingClientRect();
  const cw = cv.width||1280, ch = cv.height||720;
  const scale = Math.min(r.width/cw, r.height/ch);
  const dw = cw*scale, dh = ch*scale;
  const ox = r.left+(r.width-dw)/2, oy = r.top+(r.height-dh)/2;
  const x = (e.clientX-ox)/dw*1920, y = (e.clientY-oy)/dh*1080;
  if(x<0||y<0||x>1920||y>1080) return;
  fetch('/tap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({x,y})});
});
document.querySelectorAll('[data-k]').forEach(b=>{
  b.addEventListener('click',()=>fetch('/key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:b.dataset.k})}));
});
document.getElementById('send').onclick=()=>{
  const t = document.getElementById('txt').value; if(!t) return;
  fetch('/text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
};

async function loadApps(){
  const el = document.getElementById('apps');
  try{
    const list = await (await fetch('/apps')).json();
    el.innerHTML = '';
    if(!list.length){ el.textContent = '未发现应用'; return; }
    for(const a of list){
      const d = document.createElement('div'); d.className='app';
      const nice = a.pkg.split('.').pop();
      d.innerHTML = '<b>'+nice+'</b><small>'+a.pkg+'</small>▶';
      d.onclick = ()=>{ fetch('/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({act:a.act})}); };
      el.appendChild(d);
    }
  }catch(e){ el.textContent = '读取失败: '+e.message; }
}
loadApps();
</script>
</body>
</html>
